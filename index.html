/* Fargene er hentet fra omslaget på heftet: mørk grønn og rød ramme, gul bakside,
   lys sjøturkis himmel og hav, og nesten svart tittelskrift. */
:root {
  --bg: #eef6f3;
  --panel: #ffffff;
  --top: #2b6447;
  --top-ink: #ffffff;
  --top-muted: rgba(255, 255, 255, 0.82);
  --ink: #1e2427;
  --muted: #4d5b58;
  --none: #7d8c88;
  --line: #d5e6e0;
  --field-line: #a9c7bd;
  --accent: #2b6447;
  --accent-soft: #e0f0ea;
  --red: #b4452f;
  --yellow: #fdeb1b;
  --hit-ink: #1e2427;
  --pressed: #e6f2ee;
  --radius: 6px;
  --width: 760px;
  --song-size: 21px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }

/* Navnelinje øverst, med gul og rød stripe som rammen på omslaget. */
.top {
  background: var(--top);
  color: var(--top-ink);
  border-bottom: 4px solid var(--yellow);
  box-shadow: 0 3px 0 var(--red);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.top .name {
  max-width: calc(var(--width) + 32px);
  margin: 0 auto;
  padding: 20px 16px;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 600;
  letter-spacing: 0.01em;
}
/* Maleriet fra omslaget, med gul og rød ramme som på heftet. Vises under søket på startsiden. */
.cover {
  max-width: 220px;
  margin: 24px auto 4px;
}
.cover[hidden] { display: none; }
.cover img {
  display: block;
  width: 100%;
  height: auto;
  border: 3px solid var(--yellow);
  border-radius: 2px;
  box-shadow: 0 0 0 3px var(--red);
}
.top .name small { display: block; margin-top: 4px; font-size: 15px; font-weight: 400; color: var(--top-muted); letter-spacing: 0; }

/* Søket ligger fast øverst mens du blar. */
.controls {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 12px calc(env(safe-area-inset-right) + 16px) 12px calc(env(safe-area-inset-left) + 16px);
  background: rgba(238, 246, 243, 0.94);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.controls-inner { max-width: var(--width); margin: 0 auto; }
.search {
  display: block;
  width: 100%;
  min-height: 50px;
  padding: 10px 14px;
  border: 1px solid var(--field-line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  font-size: 20px; /* ≥16 px hindrer automatisk zoom i Safari */
  -webkit-appearance: none;
  appearance: none;
}
.search::placeholder { color: var(--none); }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }

main {
  max-width: calc(var(--width) + 32px);
  margin: 0 auto;
  padding: 8px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px);
}
.status { margin: 12px 0 8px; font-size: 16px; color: var(--ink); }
.results {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--panel);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(30, 36, 39, 0.06);
}
.results li + li { border-top: 1px solid var(--line); }
.hit {
  display: flex;
  align-items: baseline;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: 12px 16px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.hit:active, .hit:hover { background: var(--pressed); }
.hit .nr { flex: 0 0 2.4em; font-size: 20px; font-weight: 600; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.hit .body { flex: 1; min-width: 0; }
.hit .title { display: block; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.hit .snippet { display: block; margin-top: 3px; font-size: 16px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
.hit .snippet.gone { font-style: italic; color: var(--none); }
mark { background: var(--yellow); color: var(--hit-ink); padding: 0 2px; border-radius: 2px; }
.empty { padding: 20px 16px; color: var(--muted); }

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0 6px;
}
.section-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.section-head span { font-size: 14px; color: var(--muted); }
.link-btn {
  min-height: 44px;
  padding: 0 4px;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px;
  max-width: 100%;
  padding: 0 14px;
  border: 1px solid var(--field-line);
  border-radius: var(--radius);
  background: var(--panel);
  font-size: 17px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.chip:active, .chip:hover { border-color: var(--accent); }
.chip b { margin-right: 6px; color: var(--accent); }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.toc .chip { font-size: 16px; }

/* Sangvisningen legger seg over listen. */
#song {
  position: fixed;
  inset: 0;
  z-index: 5;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: 0 0 calc(env(safe-area-inset-bottom) + 40px);
}
#song[hidden] { display: none; }
.bar {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--top);
  border-bottom: 4px solid var(--yellow);
  box-shadow: 0 3px 0 var(--red);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.bar-inner {
  display: flex;
  align-items: center;
  gap: 2px;
  max-width: calc(var(--width) + 16px);
  margin: 0 auto;
  padding: 4px 8px;
}
.bar .spacer { flex: 1; }
.icon-btn {
  min-height: 44px;
  min-width: 44px;
  padding: 0 8px;
  border: 0;
  background: none;
  color: var(--top-ink);
  font-size: 18px;
  cursor: pointer;
}
.icon-btn:disabled { color: rgba(255, 255, 255, 0.4); cursor: default; }
.icon-btn.size { font-size: 17px; font-weight: 600; }
.icon-btn.size .big { font-size: 22px; }
.song-wrap {
  max-width: calc(var(--width) + 32px);
  margin: 0 auto;
  padding: 20px calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
}
.song-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
.song-head .big-nr { font-size: 44px; line-height: 1; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.song-head .sec { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.song-head h2 { margin: 0; font-size: 0; } /* tittelen leses av skjermlesere, verset viser den */
.verses { list-style: none; margin: 0; padding: 0; font-size: var(--song-size); line-height: 1.5; }
.verse { position: relative; margin: 0 0 1.1em; padding-left: 2em; }
.verse .vnr { position: absolute; left: 0; top: 0.05em; width: 1.4em; text-align: right; font-size: 0.8em; color: var(--red); font-variant-numeric: tabular-nums; }
.verse p { margin: 0; padding-left: 1em; text-indent: -1em; } /* hengende innrykk når en linje brekker */
.verse.kor { padding: 0.5em 0.8em 0.5em 1.6em; margin-left: 0.4em; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius) var(--radius) 0; font-style: italic; }
.verse.kor .label { display: block; font-size: 0.7em; font-style: normal; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.rep { color: var(--red); font-style: normal; white-space: nowrap; }
.song-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
.song-nav button {
  min-height: 56px;
  padding: 8px 14px;
  border: 1px solid var(--field-line);
  border-radius: var(--radius);
  background: var(--panel);
  font-size: 16px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
}
.song-nav button.next { text-align: right; }
.song-nav button:disabled { visibility: hidden; }
.song-nav small { display: block; color: var(--accent); font-weight: 600; }
.song-nav span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.source { margin: 24px 0 0; font-size: 15px; color: var(--muted); font-style: italic; }
.source .book { font-style: normal; color: var(--none); }
.outside {
  margin: 16px 0 0;
  padding: 6px 12px;
  border-left: 3px solid var(--accent);

anter","Sábmáj: Paul Gælok"],"seksjon":null,"side":56},{"nr":33,"tittel":"Tjáppa næjttso Divtasvuonan","vers":[["Mån diedáv tjáppa næjtsov","gev mån dåbdåv buoragit.","Mån diedáv tjáppa næjtsov Divtasvuonan.","Li sujna niera ruoppsada,","ja tjáppa tjalme alega.","Mån diedáv tjáppa næjtsov Divtasvuonan."],["Sån nuorregátten tjuottjoj,","ja sån danna guhkahij.","Ja tsitsátja gåjt vitsárdin nav tjábbát.","Sån danna ávos tjajmadij, gå vuojnij vantsav boahtemin.","Dan vantsan nuorra báhttja skihparin lij."],["De germudahtjá iehket,","biejvve gádoj allelin.","Ja sjevnjudij, ja sjevnjudij gåjt vuodna.","Dan fiervvágátten jáhtij sån de iehttset báhtjav vájmostis.","Le mujna tjáppa moarsse Divtasvuonan."]],"merknad":["Tæksta ja tjuojalvis: G. R. Schirmer","Sábmáj: Paul Gælok"],"seksjon":null,"side":58},{"nr":34,"tittel":"Tjuhppi","vers":[["Gieres Jesus alla almen","gånnå l gieres ieddne muv.","Sidá gus dån gullat muvva,","dådnå gut nav gievrra la?","Gå dån iednev mujsta válldi","sijdda gåjt de gávkudij.","Ij vån aktak lágeda muv,","davva illa diehtám dån."],["Áhttje ij la álu sijdan,","sån la hådjum jáhkáv mån.","Gå dån iednev mijás válldi,","sjattaj sådnå surgulasj.","Sån ij åvvå lágeda muv,","mån nav aktu sjaddam lav.","Ij vån aktak rågå mujna,","e ga tjulli oaddádijn."],["Dåssju Tjuhppi l lådje munji,","lunna muv la agev sån.","Gieres Jubmel várjjala suv,","juska l dåssju bena sån.","Ja de råhkålav mån dunji,","dådnå gut nav boanndá la.","Dujna li nav moattes almen,","vatte ruopptot iednev muv."],["Valla jus ij æddnám gulá,","majt mån dálla råhkålav.","Ietjam unna råmmåtjin mån","sidáv dunji råhkålit.","Viettja muvva ædnám lusi,","dan duv tjuovggis almátjij.","Válde Tjuhpiv mujna aktan,","buorre ráddna l årrum sån."]],"merknad":["Amás tjuojalvisdahkke ja tækstatjálle","Sábmáj: Paul Gælok"],"seksjon":null,"side":59},{"nr":35,"tittel":"Máhták bårjåstit?","vers":[["Máhták biekkadak bårjåstit?","Máhták ájrodak suhkat?","Máhtá gus dån de sirádit","rádnastit gadnjalahtá?"],["Máhtáv biekkadak bårjåstit.","Máhtáv ájrodak suhkat.","Valla iv galla siráda","rádnastim gadnjalahtá."]],"merknad":["Álmmuklávlla Svierigis","Sábmáj: Paul Gælok"],"seksjon":null,"side":61},{"nr":36,"tittel":"Rahtevádtse","vers":[["Rahtevádtsen lav mån riegádam.","Sijdadagá vájaldav gåjt mån.","Luondo mánán ælla mårråha.","Gå ber fridja bæssá årrot sån."],["Manen gålgå? Mujsta gatjádi.","Dav iv máhte riekta vásstedit.","Biekkan, dálken gávnnu tjielgadus.","Ilmme dunji davva subtsastus."]],"merknad":["Amás tjálle","Tjuojalvis: Elmer Scentirmay","Sábmáj: Kurt-Tore Andersen/Kåre Tjihkkom"],"seksjon":null,"side":62},{"nr":37,"tittel":"Biellutja skuoladi","vers":[["Biellutja skuoladi badjel dievátjij,","gulá bielloskuollamav gå hæsta l mannamin."],["Kor: Tjuovvola, tjuovvola rastá jiekkij aj,","gåggu bálges doalvvu duv amás miehtsijda.","De gullu badjel dieváj dat tjáppa lávllagasj,","ja miehtse vastedi dav aj ietjas jienatjijn.","Tjuovvola, tjuovvola rastá jiekkij aj,","gåggu bálges doalvvu duv amás miehtsijda."]],"merknad":["Tæksta ja tjuojalvis: J. Pierpont","Sábmáj: Paul Gælok"],"seksjon":null,"side":64},{"nr":38,"tittel":"Muv vájmmo tjierru","vers":[[":/: Muv vájmmo tjierru nav låssådit. :/:","Muv vájmmo tjierru gå ájádalav,","muv iellemav."],[":/: Dån gieres Jubmel várjjala muv :/:","Dån gieres Jubmel vatte dån fámov,","munji jáhkket."],[":/: Mån jálot sidáv duv iejvvit aj :/:","Mån jálot sidáv ja ávvomielajn,","vuolgget ierit."]],"merknad":["Amás suoma tjuojalvis","Tæksta: Paul Gælok"],"seksjon":null,"side":65},{"nr":39,"tittel":"Gå iehket germudahtjá","vers":[["Gå iehket germudahtjá, ja gájka oaddádi","de dahpav mån goadenim uvsav.","Ja tsitsátja, de nåhkådi guhtik biesenis,","de tjáŋá dån goahtásit adjáj.","Val maŋŋela iv diede gåk ájgev gålådit,","jut guhka ijájt åhtsålav gieres rádnatjam.","De ij la mujna oaddátjit miella."],["Dál tjuottjo åvdån spiedjila, vuoptajt rájddamin","– nav stuorre ja alvos la duv tjalmme.","De svahtjá má duv vájmmo. Majt åhtsål vájmmo duv?","– Dav i ájn dån vásstedit máhte!","Jut aktak ij la oadtjum duv lahka boahtet ájn.","Ja ståvlå badjel gahtsahi biktasattja duv.","Duv vuolppo, duv guobátja, duv gierdde."],["Juo l germudimen buoldan, ja tjaktja l boahtemin,","ja russna l lávvamin giettij miehtáj.","Gåjt miehttsebálggáj nanna li moattes tjádjánam.","Ja nástátja tjuovggagåhti iján.","Na jus i máhte iehkedij boahtet rádnatjam,","de diededaste muv goassa dån boadá vat.","Mån iv la duv vuojnnám juo ådno."]],"merknad":["Tæksta ja tjuojalvis: Arnulf Øverland","Sábmáj: Kurt-Tore Andersen/Kåre Tjihkkom"],"seksjon":null,"side":67},{"nr":40,"tittel":"Muv iedne lávllom","vers":[["Muv vuostasj lávllomav gulliv mån","ietjam iedne asken.","Nav hávskes bágojt lávloj sån,","da gávnnin gæjnov vájmmuj."],["Imálasj láhkáj vuohttun sij,","mån oaddájiv ja vuojnniv:","Bajás muv iedne goadátjis","manáj nav tjáppa bálges."],["Dav bálggátjav mån gehtjadav","muv vájmon muhtem ájgijt,","de måjudalli ieŋŋgila","– sij máhtti ienebuttjav."],["Muv iedne jienav guláv mån","gå muhttijn sidáv vájbbat.","De ármet lávllu munji sån","– ja vaddá ienep fámojt."]],"merknad":["Tæksta: Per Sivle","Tjuojalvis: Lars Søraas","Sábmáj: Mikal Urheim"],"seksjon":null,"side":69},{"nr":41,"tittel":"Ij la aktak jaskadabbo","vers":[["Ij la aktak jaskadabbo,","vissásap ja ávvusabbo.","Gå dat, guhti Hærráj gullu.","Ja suv mánnán agev årru."],["Jubmel ietjas mánájt gáhtti.","Sån, gut sidjij Bárnes vattij.","Galggá sidjij ármov vaddet,","sijáv almmáj dássta válldet."],["Båhtus vájku makkár nieda!","E dávk galga Hærrá gieda,","mijáv goassak ierit luojttet,","jali goassak aktu guodet."],["Ávvusa dal, unna elusj:","Hærrá, Jubmel iesj duv bælos.","Vasjulattja fámoduvvi,","Hærrá bágojs vuojteduvvi."],["Hærrá válldá, Hærrá vaddá.","Dan dieht´ galggá dat mij sjaddá,","álu boahtet midjij buorren,","ja dan divrrasamos vuorbben."]],"merknad":["Álmmukluohte Svierigis","Tæksta: Lina Sandell (1856)","Sábmáj: Harald Grundström","Ådåstuhtedum: Paul Gælok/Kurt-Tore Andersen"],"seksjon":null,"side":71},{"nr":42,"tittel":"Gieres Jesus","vers":[["Gieres Jesus dån la gåhttjum","mánájt boahtet lusi duv.","Sijá nali giedajt biedji,","sijáv buorissjivnnjádi.","Iesj dån mánnán Hærrá tiemmbel","sisá guottedum dån la.","Viehkeda muv álu mujttet","åvddågåvåt tjielggasit."],["Dån gut muv la gásstaj gåhttjum","gå mån lidjiv uhtsegasj.","Galgav ássnat? Galgav lággat?","Viehkeda muv sjattadijn.","Viehkeda muv mánnán oahppat,","iehttset bágojt Jubmelis.","Vaj mån njuorris vájmujn akti","ármobævddáj buolvvedav."],["Gå mån galgav sijdas vuolgget,","iv la goassak aktu mån.","Vájku iv mån bálggáv vuojne,","de muv lávkijt njuolggi dån.","Vaj muv vájaldus la ávvon","áhttjásim ja æddnásim.","Bája mijáv aktan Almen,","gut lip aktan ednamin."]],"merknad":["Tæksta ja tjuojalvis: Frans Michael Franzén","Sábmáj: Paul Gælok"],"seksjon":null,"side":73},{"nr":43,"tittel":"Imálasj ármmo","vers":[["Imálasj ármmo Jubmelis,","mij várjjal vájván muv.","Mån láhppum, val dån Ármmogis","muv tjalme vuojnni duv."],["Duv ármmo jaskadij gåjt muv,","ja balov gádodij.","Gå jáhkkegåhtiv vuojnniv duv.","Man divras ármmo lij!"],["Moaddi l muv bærggal gæhttjalam,","ja dåbddiv fámov suv.","Huoman la ármmo várjjalam,","ja sijddaj doalvvu muv."],["Gå moadda duhát jage lip,","mij lávllum Jubmelij.","De ihkát ájn vil hievedip,","mij aktan ieŋŋgilij."]],"merknad":["Álmmuklávlla Skottlándas","Sábmáj: Paul Gælok/Martin Urheim"],"seksjon":null,"side":75},{"nr":44,"tittel":"Dale unna vantsasj gårvvu","vers":[["Dale unna vantsasj gårvvu.","Vuostebiekkav bávtjadi.","Ij la aktak gesi dårvvu.","Mánátja, da tjierudi."],["Mij dal galggá gádjot sijáv?","Gåsi gåjt dal báhtari?","Nievres dálkke gætjo ijáv.","Máná biekkas ballám li."],["Madin sugádi sij danna,","vuorrástuvvi, hielkedi,","gå sij ájttsi tjátje nanna:","Ma li da ma labudi?"],["Oahpes jiedna mánátjijda:","«Galla loadtjijs nuorre dal.»","Jiedna, ballám vájmutjijda","ådå dårvov vattisj gal."],["Gå de Hærrá, lånestiddjen,","vanntasaj jåvsåt, loadtji de.","Gå idedismårijdiddjen","vanntsa stárffuj jåvsåt, ge!"]],"merknad":["Tæksta ja tjuojalvis: Mikael Nyberg (1871-1940)","Sábmáj: Kurt-Tore Andersen"],"seksjon":null,"side":76},{"nr":45,"tittel":"Jesus muv åvdås","vers":[["Jesus muv åvdås jámedum le.","Rabá muv tjalmijt Hærrá Jubmel.","Værrodij ietjas gájutjit muv.","Gå kruossan jámij, muv diehti sån."],["O gieresvuohta, man imálasj.","Ij aktak iehtse nav gåktu sån.","Lånestum, sáluk lav ihkevij.","Sidáv duv iehttset vájmostam mån."],["Duv mánnán, Hærrá, årrot sidáv.","Bærggala viermijs tjoavde dån muv.","Luohtedit dunji åhpada muv.","Ávujn mån agev tjuovudav duv."]],"merknad":["Tæksta ja tjuojalvis: Lina Sandell-Berg","Sami lauotasah (1911)","Ådåstuhtedum: Paul Gælok"],"seksjon":null,"side":78},{"nr":46,"tittel":"Jubmel sjivnnjedij muv","vers":[["Jubmel sjivnnjedij muv,","ietjam vájmov vattáv,","lájddi dån muv."],["Jesus lånestij muv,","ietjam vájmov vattáv,","lájddi dån muv."],["Ájlisvuojŋŋan gievrrod´,","ietjam vájmov vattáv,","lájddi dån muv."]],"merknad":["Tæksta: Gregers Lundh, Terrye Coelho´a milta (1972)","Tjuojalvis: Terrye Coelho (1972)","Sábmáj: Paul Gælok"],"seksjon":null,"side":80},{"nr":47,"tittel":"Oamedåbddo","vers":[["Le gus dån gullam vájmonit dav jienav.","Gå juokkir bahá bargov dahkam la.","De la aj gullam degu vájmon bávtjes.","Gå jiedna tjábbát dunji håladij."],["Le aj dav jienav gullam ietjat vájmon?","Gå oasálasj la ármos sjaddam dån.","De la aj lávllo-jienajn ávvudallam.","Gå jiedna l gieresvuodas håladam."],["Dav jienav galga agev jegadit dån.","Gå håladallá, galga sjávvunit.","Dat merkaj Jubmel la ájn iehttsemin duv.","Suv jiedna l dat mij vájmon gullu ájn."]],"merknad":["Tæksta: Paul Gælok","Álmmukluohte Vuonas"],"seksjon":null,"side":81},{"nr":48,"tittel":"Herluk la ednam","vers":[["Herluk la ednam, herluk Hærrá almme.","Tjábbe l sielo vájaldim.","Ednama rijkaj, tjadá le gæjnno,","almmáj mij mannap lávlodijn."],["Ájge vil båhti, ájge de vas vássi.","Buolva buolvajt guoradi.","Almmelasj lávllom, ij sjávvuna gåjt","gå sielo almmáj vájaldi."],["Ieŋŋgila lávllun, vuostak ræjnárijda,","sielos sielluj tjuodjalij:","Guddneda Hærráv! Ednamin ráfe!","Jesus ham uddni l riegádam!"]],"merknad":["Tæksta: B. S. Ingemann (1850)","Tjuojalvis: Schlesalasj álmmukluohte","Sábmáj: O. Lindgren (1949)","Ådåstuhtedum: Paul Gælok/Stig Gælok"],"seksjon":null,"side":82},{"nr":49,"tittel":"Muv vájmmo vájalt dåppe","vers":[["Muv vájmmo vájalt dåppe, gån Jesus riegádij.","Muv ájádusá dasi, de álu tjåhkani.","Dasi l muv åhtsålibme, gån jáhko dávver la.","Danen iv vajálduhte dav Javllaijáv mån."],["Dat sjievnnjis stálla galggá, muv vájmon viesudit.","Værálda bilkkedusáv vajálduhtáv de mån.","Danna gal huomahav mån, gånnå muv árvvo la,","gå vájmmuj tjielggiduvvá, dat kruppo mujtto de."],["Vaj gåk dal galgav tjielggit, gå ájádaláv dav.","Gå stállan vellahimen la alme gånågis.","Gå alme ávvo, guddne, ja báhko Jubmela,","nav badjelgehtjaduvvam, dán hæjos ednamin."],["Ælla gåjt hærráj goade, da dunji hiervvidum.","Dån lidji dåssju gåhttjot, de oadtjot lidji gájk´.","Jus lidji dalloj tjágŋat dån hærvva-gárvojda,","de lidjin gånågisá duv giedav tjulestit."],["Manen dån ittji bieja, iesj almev goahtenat.","Ja bája nástijt tjuovggat, dån alme bajemus.","Ja manen ittji bája, ieŋŋgilijt luojttádit,","ma divras gárvoj sisá, duv lidjin giesadit."],["Gal tsitsátjin la biesse, ja liekkos suodje aj.","Ja fálffo suojev gávnná, ja idjaráfev aj.","Ja lædjánin la biedjo, gån´ vuojŋadallá sån.","Valla muv Jubmel vællaj, værálda stálla sin´."],["Val boade, rahpat sidáv muv sielov, vájmov dal.","Muv sjuohkkanisájt gulá, o Jesus boade dal.","Ij dát la amás sadje, dån iesj dav gárvedam.","Åmastit vájmmo galggá, duv alme gånågis."],["Mån pálmmaåvsijt biejav, duv kruppo birra ham.","Duv åvdås sidáv viessot, ja jámbet galgav aj.","O boade vaj mån gávnav, duv ávvovuodav aj.","Gå dån muv vájmo sinna, la sihtam riegádit."]],"merknad":["Álmmukluohte","Tæksta: H. A. Brorson","Sábmáj: Paul Gælok"],"seksjon":null,"side":84},{"nr":50,"tittel":"Hosiánná","vers":[["Hosiánná Dávida bárnne.","Gijttedum årrus sån.","Gijttedum Dávida bárnne,","guhti boahtá Hærrá namán.","Hosiánná, hosiánná,","hosiánná, hosiánná.","Gijttedum Dávida bárnne,","guhti boahtá Hærrá namán."]],"merknad":["Tæksta: Matt. 21.9","Tjuojalvis: G. J. Vogler","Sábmáj: Kurt-Tore Andersen"],"seksjon":null,"side":86},{"nr":51,"tittel":"Jesusav mån lávlov","vers":[["Jesusav mån lávlov,","dåssju Jesusav,",":/: Gæsta suttojt oattjov","ándagissaj mån. :/:"],["Sån muv stuorra suttojt,","varájn vaskodij.",":/: Váldij suddofáŋgav,","ármo iellemij :/:"],["Vasjulattja fámos,","gádjum suddárav.",":/: Fáŋgav luovas luojtij,","Jubmel´ mánná lav :/:"],["Gånågisá mánná,","lav ham ármos mån.",":/: Kråvnåv árbbiv akti,","rijkav oattjov aj :/:"],["Besav ihkát årrot,","gållestádan mån.",":/: Gåhtjodum lav guossen,","hedjaj ihkevij :/:"]],"merknad":["Tæksta: Simo Korpela","Tjuojalvis: Martti Hela","Sábmáj: Paul Gælok/Kurt-Tore Andersen"],"seksjon":null,"side":87},{"nr":52,"tittel":"De bajás siello muv","vers":[["De bajás siello muv.","Badjána måjve sissta!","Jubmela Lippa åvddåj galga lájdåstit.","Ja vájku tjalmme duv","ij gierda Hærrá tjuovgav,","de huoman ávvomielajn maná lávlutjit.","Gåhtjodum dån la.","Gåhtjodum gájka,","Jubmela Lippa hedjaj almen ihkevij.","Vuoj makkár guddne de,","gå kråvnnidum dån le.","Le ham dat oasse, divras dávver, árbbe duv.","Le ármmo Jubmelis gå værrodam la suv."],["De dåppe lávludav,","ja ådå luodev åhpav.","Ij goassak någå dat, ij goassak oamo ga.","Dáppe muv jiedna le","nav sædos, huoman lávlov.","Dat gijttolávlla ij das goassak sjávvunna.","Varájn muv rájnnij.","Vuojŋŋanav vattij.","Lånåstusbargo baktu l ráfe Jubmelijn.","Guddnedav Jubmelav,","ja Lippav gijtatjav.","Muv gånågissaj ihkevájggáj hievedus!","Ja dasi almme, ednam «Ámen» vásstedus!"]],"merknad":["Álmmukluohte Suomas","Tæksta: Johan Kahl (1721-1746)","Sábmáj: Kurt-Tore Andersen"],"seksjon":null,"side":88},{"nr":53,"tittel":"Balvaj duogen lav gullam","vers":[["Balvaj duogen lav gullam mån bájkev,","Mierkkágåbtjådum ednamis bajás.","Bæjvádagáv dajn gáttijn lav gullam,","jåvsådittjav gåjt akti mån dåk.","Hállelujá dat debtjas muv lávllot,","Hállelujá, dan bájkkáj mån ájgov,","vájku juolge dal låssu ja vájbbi.","O dån Jubmel, mån jåvsådiv dåk."],["Gadnjalattásin gullam lav lándav,","ælla surgo, ij nieda, e doaro.","E ga guhkev da skihpasa gierda,","jåvsådittjav gåjt akti mån dåk.","Hállelujá, mån vuojŋŋanin ávon,","almes lávllagijt guláv gå tjuodji,","ja da gajkku muv ednamis luovas.","O dån Jubmel, mån jåvsådiv dåk."],["Muohtavielggadin gullam lav gárvojt,","ja gåk kråvnå li guojttemin dåppe.","Fuova birr´ mij la almen, lav gullam,","jåvsådittjav gåjt akti mån dåk.","Hállelujá, mij dal ávvudallap,","Hállelujá, ep des guoktálatta,","iv des guhkev mån jårå ja gahtja.","O dån Jubmel, mån jåvsådiv dåk."]],"merknad":["Álmmukluohte Gárjjelis","Tæksta: Lydia Lithell","Sábmáj: Mikal Urheim"],"seksjon":null,"side":90},{"nr":54,"tittel":"Kruossav iv mån biehttet máhte","vers":[["Kruossav iv mån biehttet máhte,","sálukvuohta l giehtje dan.","Lev gus åvvå ristagis mån,","jus iv Krist duv kruossav guotte.","Jesus ij gåjt dåbdå sijáv,","jus e kruossav guottatja.","Kruossav iv mån biehttet máhte,","sálukvuohta l giehtje dan."],["Miehttsevájaldusá maŋŋáj","ájtteklánndaj jåvsådip.","Vájku dáppe bilkkeduvvap,","ep dav huoman mujte dalloj","gå dievalasjvuohtaj bessap.","Ávvomielajn lávludip.","Miehttsevájaldusá maŋŋáj","ájtteklánndaj jåvsådip."]],"merknad":["Álmmukluohte Vuonas","Tæksta: H. A. Brorson","Sábmáj: Paul Gælok"],"seksjon":null,"side":92},{"nr":55,"tittel":"Vájaldiddje amás bálggán","vers":[["Mån vájaldiddje amás bálggán,","mån vájvij tjadá vájaldav.","Val diedáv herluk vuodav gietjen,","akti gåjt jåvsådittjav dåk.","Dåppe muv áhttje asskáj válldá.","De lávlov jienajn almmelasj.","Jordána æno badjel vuolgáv,","ja ájtteklánndaj jåvsådav."],["Ge tjáhppis balva almev gåbttji.","Muv vájaldibme låssåt la.","Val balvaj duogen biejvve bájttá.","Ij biejve bájttem någå das.","Dåppe muv ieddne asskáj válldá.","De lávlov jienajn almmelasj.","Jordána æno badjel vuolgáv,","ja ájtteklánndaj jåvsådav."],["Dåppe mån gållekråvnåv guottáv","gå ájtteklánndaj jåvsådav.","Dåppe mån Lånestiddjev gijtáv,","aktidav ieŋŋgillávllagij.","Dåppe muv Jesus asskáj válldá.","De lávlov jienajn almmelasj.","Jordána æno badjel vuolgáv,","ja ájtteklánndaj jåvsådav."]],"merknad":["Amás tækstatjálle ja tjuojalvisdahkke","Sábmáj: Kurt-Tore Andersen"],"seksjon":null,"side":94},{"nr":56,"tittel":"Kristusa háve jaskadi","vers":[["Kristusa háve jaskadi.","Da suttojt gájkka rájnniji.","Kristusa jábmem, varra suv","giehpet dal jábmemvájvijt muv."],["Muv siello jaskadum dal la.","Ij duobmo åvdån suorggana.","Ávujn ja ráfijn vuolgáv dal.","Vájku mån jámáv, viesov val."],["Vuoj, jábmem, boade dålvutjit,","ihkeva ávvuj årotjit.","Hæggam la Kristus, jabmem de","dat munji ávkken sjaddam le."]],"merknad":["Amás tjálle Tysklándas","Ådåstuhtedum: Kurt-Tore Andersen"],"seksjon":null,"side":96},{"nr":57,"tittel":"Iehketlávlla","vers":[["O Jesus bieja dálla","duv såjijt badjel muv.","Ja vuojŋádallat bája","dal dievnastiddjev duv.","Åro dån gievrrudahkan","agev muv sielluj dån.","Ja bája juohkka biejve","ármostat viessot muv."],["Ándagis luojte suttojt","ja rájnni varájnit.","Dån ájlistahte vájmov","o viehkediddje dån.","Dån sidá suttulattjajt","viehkedit ármujnat.","Ja bája ráfen mijáv","de oadet njálgugit."]],"merknad":["Tæksta ja tjuojalvis: Lina Sandell-Berg","Sábmáj: K. B. Wiklund","Ådåstuhtedum: Paul Gælok"],"seksjon":null,"side":97}]}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SONGS = DATA.sanger;
  var MAX_HITS = 200;
  var MAX_RECENT = 10;
  var SIZES = [16, 18, 21, 24, 28, 32, 38];

  // localStorage kan mangle eller kaste unntak (privat modus, blokkert lagring). Appen virker uansett.
  var store = {
    get: function (key, fallback) {
      try {
        var value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
  };

  // Normalisering for søk. Gir samme lengde som teksten, slik at treff kan utheves på riktig sted:
  // små bokstaver, á/ŋ likt a/n (så det går an å søke uten samisk tastatur), svensk ö/ä likt
  // norsk ø/æ, og alt som ikke er bokstav eller siffer blir mellomrom. å, æ og ø holdes for seg.
  var FOLD = { "á": "a", "à": "a", "â": "a", "ń": "n", "ŋ": "n", "ñ": "n", "é": "e", "è": "e", "ê": "e",
    "ó": "o", "ò": "o", "ü": "u", "ú": "u", "í": "i", "ö": "ø", "ä": "æ", "š": "s", "č": "c", "ž": "z", "đ": "d", "ŧ": "t" };
  function fold(s) {
    return s.toLowerCase().replace(/[^0-9a-zæøå]/g, function (c) { return FOLD[c] || " "; });
  }
  function words(s) { return fold(s.normalize("NFC")).split(" ").filter(Boolean); }

  // Forbered sangene: nøkkel, linjer med søketekst, og samlet tekst for frasesøk.
  // Skjulte sanger (Tysfjordsangen) er med i søket, men ikke i innholdet eller når man blar.
  var BROWSE = SONGS.filter(function (song) { return !song.skjult; });
  BROWSE.forEach(function (song, i) { song.pos = i; });
  function neighbour(song, d) { return song.skjult ? null : BROWSE[song.pos + d] || null; }

  var byKey = {};
  SONGS.forEach(function (song, i) {
    song.index = i;
    song.key = song.nokkel || String(song.nr);
    byKey[song.key] = song;
    // Hver linje får merket den har i sangvisningen: versnummer (omkved telles ikke) eller «Kor».
    song.lines = [];
    var verseNo = 0;
    song.vers.forEach(function (verse) {
      var kor = /^Kor\s*:/i.test(verse[0]);
      var mark = kor ? "Kor" : (verseNo += 1) + ". vers";
      verse.forEach(function (text, i) {
        if (kor && i === 0) text = text.replace(/^Kor\s*:\s*/i, "");
        song.lines.push({ text: text, f: fold(text), mark: mark });
      });
    });
    song.flat = " " + words(song.lines.map(function (l) { return l.text; }).join(" ")).join(" ") + " ";
    song.titleFlat = " " + words([song.tittel].concat(song.sokeord || []).join(" ")).join(" ") + " ";
    // Tittel (som ofte ikke er første linje), opphav (tekst, melodi, oversetter) og ekstra søkeord
    // gir også treff, f.eks. «Katyusha» eller «Prøysen».
    song.secFlat = " " + words([song.tittel, song.seksjon || song.spraak || ""].concat(song.sokeord || [], song.merknad || []).join(" ")).join(" ") + " ";
  });

  var input = document.getElementById("q");
  var home = document.getElementById("home");
  var statusEl = document.getElementById("status");
  var list = document.getElementById("results");
  var songEl = document.getElementById("song");
  var songBody = document.getElementById("song-body");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function label(song) { return song.merke || String(song.nr); }

  function search(query) {
    var q = words(query);
    if (!q.length) return { q: q, hits: [] };
    var phrase = " " + q.join(" ");
    var numberOnly = /^\d+$/.test(query.trim());
    var hits = [];
    SONGS.forEach(function (song) {
      var score = 0;
      if (numberOnly && String(song.nr) === query.trim()) score = 1000;
      // Alle ordene må finnes i sangen (som begynnelsen av et ord, eller inni et ord).
      var all = q.every(function (w) { return song.flat.indexOf(w) !== -1 || song.secFlat.indexOf(" " + w) !== -1; });
      if (all) {
        score += 10;
        if (song.flat.indexOf(phrase) !== -1 || song.secFlat.indexOf(phrase + " ") !== -1) score += 40;
        if (song.titleFlat.indexOf(phrase) === 0) score += 100;
        else if (song.titleFlat.indexOf(phrase) !== -1) score += 30;
        q.forEach(function (w) { if (song.flat.indexOf(" " + w) !== -1) score += 5; });
      }
      if (score) hits.push({ song: song, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score || a.song.index - b.song.index; });
    return { q: q, hits: hits };
  }

  // Finn linjen som best viser hvorfor sangen traff: helst hele frasen, ellers flest av ordene.
  function bestLine(song, q) {
    var best = null, bestScore = 0;
    var phrase = q.join(" ");
    song.lines.forEach(function (line) {
      var squeezed = line.f.replace(/ +/g, " ");
      var s = squeezed.indexOf(phrase) !== -1 ? 100 : 0;
      q.forEach(function (w) { if (line.f.indexOf(w) !== -1) s += 1; });
      if (s > bestScore) { best = line; bestScore = s; }
    });
    return best;
  }

  // Uthev søkeordene i en tekst. Ordene matches mot den normaliserte teksten (samme lengde).
  function highlight(text, q) {
    var frag = document.createDocumentFragment();
    if (!q || !q.length) { frag.appendChild(document.createTextNode(text)); return frag; }
    var f = fold(text);
    var marks = [];
    q.forEach(function (w) {
      for (var at = f.indexOf(w); at !== -1; at = f.indexOf(w, at + 1)) marks.push([at, at + w.length]);
    });
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var pos = 0;
    marks.forEach(function (m) {
      if (m[0] < pos) { if (m[1] > pos) m[0] = pos; else return; }
      frag.appendChild(document.createTextNode(text.slice(pos, m[0])));
      var el = document.createElement("mark");
      el.textContent = text.slice(m[0], m[1]);
      frag.appendChild(el);
      pos = m[1];
    });
    frag.appendChild(document.createTextNode(text.slice(pos)));
    return frag;
  }

  function hitItem(song, q, snippetLine) {
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hit";
    var nr = document.createElement("span");
    nr.className = "nr";
    nr.textContent = label(song);
    var body = document.createElement("span");
    body.className = "body";
    var title = document.createElement("span");
    title.className = "title";
    title.lang = "smj";
    title.appendChild(highlight(song.tittel, q));
    body.appendChild(title);
    if (song.mangler) {
      var gone = document.createElement("span");
      gone.className = "snippet gone";
      gone.textContent = "Teksten mangler i PDF-utgaven";
      body.appendChild(gone);
    } else if (snippetLine && snippetLine.text !== song.vers[0][0]) {
      var sn = document.createElement("span");
      sn.className = "snippet";
      sn.appendChild(document.createTextNode(snippetLine.mark + ": "));
      sn.appendChild(highlight(snippetLine.text, q));
      body.appendChild(sn);
    }
    btn.appendChild(nr);
    btn.appendChild(body);
    btn.addEventListener("click", function () {
      openSong(song, q);
    });
    li.appendChild(btn);
    return li;
  }

  function sectionHead(title, right, onRight) {
    var head = document.createElement("div");
    head.className = "section-head";
    var h = document.createElement("h2");
    h.textContent = title;
    head.appendChild(h);
    if (right && onRight) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "link-btn";
      btn.textContent = right;
      btn.addEventListener("click", onRight);
      head.appendChild(btn);
    } else if (right) {
      var span = document.createElement("span");
      span.textContent = right;
      head.appendChild(span);
    }
    return head;
  }

  function getRecent() {
    var r = store.get("hanna-sistesanger", []);
    // Skjulte sanger skal ikke vises på forsiden, heller ikke under «Sist åpnet».
    return Array.isArray(r) ? r.filter(function (k) { return byKey[k] && !byKey[k].skjult; }) : [];
  }
  function addRecentSong(song) {
    if (song.skjult) return;
    var r = getRecent().filter(function (k) { return k !== song.key; });
    r.unshift(song.key);
    store.set("hanna-sistesanger", r.slice(0, MAX_RECENT));
  }

  // Startsiden (tomt søkefelt): siste sanger, hopp til seksjon, og alle sangene sortert etter nummer.
  function renderHome() {
    home.textContent = "";
    list.textContent = "";
    statusEl.textContent = "";

    var recent = getRecent();
    if (recent.length) {
      home.appendChild(sectionHead("Sist åpnet", "Tøm", function () { store.set("hanna-sistesanger", []); render(); }));
      var chips = document.createElement("div");
      chips.className = "chips";
      recent.forEach(function (key) {
        var song = byKey[key];
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        var b = document.createElement("b");
        b.textContent = label(song);
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(song.tittel));
        chip.lang = "smj";
        chip.addEventListener("click", function () { openSong(song); });
        chips.appendChild(chip);
      });
      home.appendChild(chips);
    }

    // Heftet har ingen seksjoner. Hopp-knappene vises bare hvis det kommer flere.
    if (DATA.seksjoner.length > 1) home.appendChild(sectionHead("Innhold"));
    var toc = document.createElement("div");
    toc.className = "toc";
    DATA.seksjoner.forEach(function (sec, i) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = sec.navn;
      chip.addEventListener("click", function () {
        var target = document.getElementById("sec-" + i);
        if (target) window.scrollTo(0, target.getBoundingClientRect().top + window.pageYOffset - 90);
      });
      toc.appendChild(chip);
    });
    if (DATA.seksjoner.length > 1) home.appendChild(toc);

    DATA.seksjoner.forEach(function (sec, i) {
      var nrs = sec.sanger.filter(function (n) { return n !== null; });
      var span = nrs.length ? nrs[0] + "–" + nrs[nrs.length - 1] : "";
      var head = sectionHead(DATA.seksjoner.length > 1 ? sec.navn : "Alle sangene", span);
      head.id = "sec-" + i;
      home.appendChild(head);
      var ul = document.createElement("ul");
      ul.className = "results";
      sec.sanger.forEach(function (n) {
        ul.appendChild(hitItem(byKey[String(n)], null, null));
      });
      home.appendChild(ul);
    });
  }

  function render() {
    var query = input.value;
    // Omslagsbildet vises bare på startsiden, ikke over søketreffene.
    var searching = words(query).length > 0;
    document.getElementById("cover").hidden = searching;
    if (!searching) { renderHome(); return; }
    home.textContent = "";
    var result = search(query);
    var hits = result.hits;
    list.textContent = "";
    var frag = document.createDocumentFragment();
    hits.slice(0, MAX_HITS).forEach(function (h) {
      var numberHit = h.score >= 1000;
      frag.appendChild(hitItem(h.song, numberHit ? null : result.q, numberHit ? null : bestLine(h.song, result.q)));
    });
    list.appendChild(frag);
    if (!hits.length) {
      statusEl.textContent = "";
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = /^\d+$/.test(query.trim())
        ? "Det finnes ingen sang nummer " + query.trim() + ". Sangene har nummer 1–" + DATA.seksjoner.reduce(function (m, s) { return Math.max.apply(null, [m].concat(s.sanger.filter(Number))); }, 0) + "."
        : "Ingen treff på «" + query.trim() + "».";
      list.appendChild(empty);
    } else {
      statusEl.textContent = hits.length + (hits.length === 1 ? " sang" : " sanger") +
        (hits.length > MAX_HITS ? ", viser de første " + MAX_HITS : "");
    }
  }

  // Repetisjonstegnet :/: vises tydelig i aksentfarge.
  function lineContent(text, q) {
    var frag = document.createDocumentFragment();
    text.split(/(:\/:)/).forEach(function (part) {
      if (part === ":/:") {
        var rep = document.createElement("span");
        rep.className = "rep";
        rep.setAttribute("aria-label", "gjentas");
        rep.textContent = ":/:";
        frag.appendChild(rep);
      } else if (part) {
        frag.appendChild(highlight(part, q));
      }
    });
    return frag;
  }

  function showSong(song, q) {
    songBody.textContent = "";
    var head = document.createElement("div");
    head.className = "song-head";
    var nr = document.createElement("span");
    nr.className = "big-nr";
    nr.textContent = song.nr === null ? "" : song.nr;
    var sec = document.createElement("span");
    sec.className = "sec";
    // Heftet har ingen seksjoner, så tittelen står ved nummeret, slik som overskriftene i heftet.
    sec.textContent = song.seksjon || song.spraak || song.tittel;
    if (!song.seksjon && !song.spraak) sec.lang = "smj";
    var h2 = document.createElement("h2");
    h2.id = "song-title";
    h2.textContent = (song.nr === null ? "" : "Sang " + song.nr + ": ") + song.tittel;
    head.appendChild(nr);
    head.appendChild(sec);
    head.appendChild(h2);
    songBody.appendChild(head);

    var ol = document.createElement("ol");
    ol.className = "verses";
    ol.lang = "smj";
    if (song.mangler) {
      var gone = document.createElement("p");
      gone.className = "outside";
      gone.textContent = "Teksten til denne sangen mangler, fordi side " + song.side + " ikke er med i PDF-utgaven av heftet.";
      songBody.appendChild(gone);
    }
    var verseNo = 0;
    var firstMark = null;
    song.vers.forEach(function (verse) {
      var li = document.createElement("li");
      var lines = verse.slice();
      var isKor = /^Kor\s*:/i.test(lines[0]);
      if (isKor) {
        li.className = "verse kor";
        var lab = document.createElement("span");
        lab.className = "label";
        lab.textContent = "Kor";
        li.appendChild(lab);
        lines[0] = lines[0].replace(/^Kor\s*:\s*/i, "");
      } else {
        li.className = "verse";
        verseNo += 1;
        if (song.vers.length > 1) {
          var vnr = document.createElement("span");
          vnr.className = "vnr";
          vnr.textContent = verseNo + ".";
          li.appendChild(vnr);
        }
      }
      lines.forEach(function (text) {
        var p = document.createElement("p");
        p.appendChild(lineContent(text, q));
        li.appendChild(p);
      });
      if (!firstMark) firstMark = li.querySelector("mark");
      ol.appendChild(li);
    });
    songBody.appendChild(ol);

    var nav = document.createElement("div");
    nav.className = "song-nav";
    [[-1, "prev", "‹ Forrige"], [1, "next", "Neste ›"]].forEach(function (d) {
      var other = neighbour(song, d[0]);
      var b = document.createElement("button");
      b.type = "button";
      b.className = d[1];
      b.disabled = !other;
      if (other) {
        var small = document.createElement("small");
        small.textContent = d[2] + " · " + label(other);
        var span = document.createElement("span");
        span.textContent = other.tittel;
        b.appendChild(small);
        b.appendChild(span);
        b.addEventListener("click", function () { goTo(other); });
      }
      nav.appendChild(b);
    });
    if (song.skjult) nav.style.display = "none"; // skjulte sanger har ingen forrige/neste
    songBody.appendChild(nav);

    // Samme sang på andre språk.
    var others = song.gruppe ? SONGS.filter(function (s) { return s.gruppe === song.gruppe && s !== song; }) : [];
    if (others.length) {
      songBody.appendChild(sectionHead("Andre språk"));
      var langs = document.createElement("div");
      langs.className = "chips";
      others.forEach(function (o) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        var b = document.createElement("b");
        b.textContent = o.spraak;
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(o.tittel));
        chip.addEventListener("click", function () { goTo(o); });
        langs.appendChild(chip);
      });
      songBody.appendChild(langs);
    }

    var source = document.createElement("p");
    source.className = "source";
    (song.merknad || []).forEach(function (text, i) {
      if (i) source.appendChild(document.createElement("br"));
      var span = document.createElement("span");
      span.lang = "smj";
      span.textContent = text;
      source.appendChild(span);
    });
    if (!song.skjult) {
      if (source.firstChild) source.appendChild(document.createElement("br"));
      var book = document.createElement("span");
      book.className = "book";
      book.textContent = DATA.meta.tittel + " (" + DATA.meta.aar + "), s. " + song.side + ".";
      source.appendChild(book);
    }
    if (source.firstChild) songBody.appendChild(source);
    if (song.skjult) {
      var outside = document.createElement("p");
      outside.className = "outside";
      outside.textContent = "Denne sangen er ikke en del av sangboken «" + DATA.meta.tittel + "».";
      songBody.appendChild(outside);
    }

    prevBtn.disabled = !neighbour(song, -1);
    nextBtn.disabled = !neighbour(song, 1);
    document.title = (song.nr === null ? "" : song.nr + ". ") + song.tittel + " – " + DATA.meta.tittel;
    songEl.hidden = false;
    songEl.scrollTop = 0;
    // Hopp ned til første treff hvis det ikke er i første vers.
    if (firstMark && firstMark.getBoundingClientRect().top > window.innerHeight * 0.7) {
      songEl.scrollTop = firstMark.getBoundingClientRect().top - 140;
    }
    addRecentSong(song);
  }

  // Sangvisningen legges i nettleserhistorikken (#12), slik at tilbake-knapp og -sveip fungerer,
  // og adressen kan deles eller legges som bokmerke.
  var current = null;
  var pushed = false;
  function openSong(song, q) {
    if (!song) return;
    input.blur();
    current = { song: song, q: q || null };
    if (songEl.hidden) { history.pushState({ song: song.key }, "", "#" + song.key); pushed = true; }
    else history.replaceState({ song: song.key }, "", "#" + song.key);
    showSong(song, current.q);
  }
  function goTo(song) {
    current = { song: song, q: null };
    history.replaceState({ song: song.key }, "", "#" + song.key);
    showSong(song, null);
  }
  function closeSong() {
    songEl.hidden = true;
    pushed = false;
    current = null;
    document.title = DATA.meta.tittel;
    if (!words(input.value).length) renderHome();
  }

  window.addEventListener("popstate", function () {
    var key = location.hash.slice(1);
    if (byKey[key]) { current = { song: byKey[key], q: null }; showSong(byKey[key], null); }
    else closeSong();
  });
  document.getElementById("back").addEventListener("click", function () {
    if (pushed) history.back();
    else { history.replaceState(null, "", location.pathname + location.search); closeSong(); }
  });
  prevBtn.addEventListener("click", function () { var s = current && neighbour(current.song, -1); if (s) goTo(s); });
  nextBtn.addEventListener("click", function () { var s = current && neighbour(current.song, 1); if (s) goTo(s); });
  document.addEventListener("keydown", function (e) {
    if (songEl.hidden || e.target === input) return;
    if (e.key === "ArrowLeft") prevBtn.click();
    else if (e.key === "ArrowRight") nextBtn.click();
    else if (e.key === "Escape") document.getElementById("back").click();
  });

  // Tekststørrelse i sangvisningen, lagret på enheten.
  var sizeIndex = store.get("hanna-tekststorrelse", 2);
  if (!(sizeIndex >= 0 && sizeIndex < SIZES.length)) sizeIndex = 2;
  function applySize() {
    document.documentElement.style.setProperty("--song-size", SIZES[sizeIndex] + "px");
    document.getElementById("smaller").disabled = sizeIndex === 0;
    document.getElementById("bigger").disabled = sizeIndex === SIZES.length - 1;
    store.set("hanna-tekststorrelse", sizeIndex);
  }
  document.getElementById("smaller").addEventListener("click", function () { if (sizeIndex > 0) { sizeIndex--; applySize(); } });
  document.getElementById("bigger").addEventListener("click", function () { if (sizeIndex < SIZES.length - 1) { sizeIndex++; applySize(); } });
  applySize();

  var timer = null;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { render(); window.scrollTo(0, 0); }, 120);
  });
  // Enter åpner sangen direkte når det bare er ett treff, eller når man har skrevet et sangnummer.
  input.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    clearTimeout(timer);
    render();
    var result = search(input.value);
    if (result.hits.length && (result.hits[0].score >= 1000 || result.hits.length === 1)) {
      var top = result.hits[0];
      openSong(top.song, top.score >= 1000 ? null : result.q);
    } else {
      input.blur();
    }
  });

  // Offline-støtte. Service workeren finnes bare når appen lastes fra en nettadresse, ikke som lokal fil.
  // Siden vises fra cache, så en ny versjon blir lastet ned i bakgrunnen. Når det finnes en cache
  // med en annen versjon enn denne siden, tilbyr vi å laste inn på nytt.
  var VERSION = "89ae76ccbabe";
  function showUpdate() { document.getElementById("update").hidden = false; }
  function checkForUpdate() {
    caches.keys().then(function (keys) {
      var others = keys.filter(function (k) { return k.indexOf("hanna-") === 0 && k !== "hanna-" + VERSION; });
      if (others.length) showUpdate();
    }).catch(function () {});
  }
  if ("serviceWorker" in navigator && "caches" in window && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.type === "aktivert" && e.data.versjon !== VERSION) showUpdate();
    });
    navigator.serviceWorker.register("sw.js").catch(function () {});
    navigator.serviceWorker.ready.then(checkForUpdate);
    document.getElementById("reload").addEventListener("click", function () { location.reload(); });
  }

  // Testkrok for automatisk verifisering.
  window.sangbok = {
    search: function (q) { return search(q).hits.map(function (h) { return label(h.song) + " " + h.song.tittel; }); }
  };

  render();
  // Åpnet med #12 i adressen: vis sang 12 direkte, med startsiden under.
  var startKey = location.hash.slice(1);
  if (byKey[startKey]) {
    history.replaceState(null, "", location.pathname + location.search);
    openSong(byKey[startKey]);
  } else if (location.hash) {
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
</script>
</body>
</html>
